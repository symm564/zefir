<style>
  :root{
    --bg:#FBF7F4; --cream:#F6E7E1; --card:#FFFFFF;
    --primary:#D98A94; --primary-dark:#C06472; --primary-soft:#F6E3E6;
    --sage:#A9C0A0; --sage-soft:#EDF3EA; --peach:#F3D9C9; --butter:#F6E7C9;
    --text:#4E3D42; --muted:#8A7A80;
    --shadow:0 12px 32px rgba(94,64,72,.09);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:92px}
  body{font-family:'Manrope','Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.65;overflow-x:hidden}
  img{max-width:100%;display:block}
  ::selection{background:var(--primary);color:#fff}
  .container{width:min(1140px,92%);margin:0 auto}
  section{padding:84px 0}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 30px;border:none;border-radius:999px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;transition:transform .25s,box-shadow .25s,background .25s}
  .btn-primary{background:linear-gradient(135deg,#E7A6AF,#C06472);color:#fff;box-shadow:0 12px 26px rgba(192,100,114,.35)}
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 18px 34px rgba(192,100,114,.45)}
  .btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary-dark)}
  .btn-outline:hover{background:var(--primary-soft);transform:translateY(-3px)}
  .btn-small{padding:10px 22px;font-size:.9rem}

  header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(251,247,244,.82);backdrop-filter:blur(12px);transition:box-shadow .3s}
  header.scrolled{box-shadow:0 6px 24px rgba(94,64,72,.1)}
  .header-inner{display:flex;align-items:center;justify-content:space-between;height:78px}
  .logo{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:700;color:var(--primary-dark);text-decoration:none}
  .logo b{color:var(--text)}
  nav{display:flex;align-items:center;gap:28px}
  nav a{color:var(--text);text-decoration:none;font-weight:600;font-size:.95rem;opacity:.85;transition:.2s}
  nav a:hover{color:var(--primary-dark);opacity:1}
  .burger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px}
  .burger span{width:26px;height:2.5px;border-radius:2px;background:var(--text);transition:.3s}
  .burger.active span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
  .burger.active span:nth-child(2){opacity:0}
  .burger.active span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}

  .hero{padding:158px 0 90px}
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center}
  .hero-badge{display:inline-flex;align-items:center;gap:8px;background:var(--primary-soft);color:var(--primary-dark);padding:8px 18px;border-radius:999px;font-weight:700;font-size:.85rem}
  h1{font-family:'Playfair Display',serif;font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.16;margin:20px 0 18px}
  h1 i{color:var(--primary-dark)}
  .hero-sub{color:var(--muted);font-size:1.08rem;max-width:520px}
  .hero-buttons{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
  .hero-stats{display:flex;gap:40px;flex-wrap:wrap;margin-top:44px}
  .stat b{display:block;font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--primary-dark)}
  .stat span{color:var(--muted);font-size:.9rem}
  .hero-photo{position:relative}
  .hero-photo::before{content:'';position:absolute;top:-26px;right:-26px;width:130px;height:130px;border-radius:50%;background:var(--peach);z-index:-1}
  .hero-photo::after{content:'';position:absolute;bottom:-26px;left:-26px;width:110px;height:110px;border-radius:50%;background:var(--sage-soft);z-index:-1}
  .hero-photo img{width:100%;aspect-ratio:5/5.4;object-fit:cover;border-radius:30px;box-shadow:0 30px 60px rgba(94,64,72,.2)}
  .hero-float{position:absolute;bottom:24px;left:-26px;background:#fff;border-radius:18px;padding:12px 20px;box-shadow:var(--shadow);font-weight:800;font-size:.95rem}
  .hero-float small{display:block;font-weight:600;color:var(--muted)}

  .section-head{text-align:center;max-width:660px;margin:0 auto 52px}
  .tag{color:var(--primary-dark);letter-spacing:.2em;text-transform:uppercase;font-size:.78rem;font-weight:800}
  .section-title{font-family:'Playfair Display',serif;font-size:clamp(1.7rem,3.6vw,2.5rem);margin-top:12px}
  .section-sub{color:var(--muted);margin-top:14px}

  .adv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
  .adv-card{background:var(--card);border-radius:22px;padding:30px 26px;box-shadow:var(--shadow);transition:transform .3s}
